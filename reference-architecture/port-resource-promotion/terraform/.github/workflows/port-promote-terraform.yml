name: port-promote-terraform

# Promotes Port configuration — the committed Terraform root in
# $TF_WORKING_DIRECTORY — to Integration on merge, then Staging and
# Production on release.
#
# Setup, environment configuration, and first-run bootstrap:
# https://github.com/port-experimental/port-out-of-the-box/tree/main/reference-architecture/port-resource-promotion/terraform
#
# Before you edit:
#   - TF_WORKING_DIRECTORY and the on.push / on.pull_request path filters must
#     name the same directory, or changes stop triggering the pipeline.
#   - plan-int runs on pull_request with integration secrets in scope. The
#     head.repo.full_name guard is what excludes fork PRs. Do not remove it.
#   - The first run is red by design until generated.tf is committed.

on:
  pull_request:
    branches: [main]          # PR-to-trunk only; branch previews belong to sandbox (not modeled yet)
    paths:
      - "reference-architecture/port-resource-promotion/terraform/terraform/**"
      - ".github/workflows/port-promote-terraform.yml"
      - ".github/actions/terraform-*/**"
  push:
    branches: [main]          # update if your default branch has a different name
    paths:
      - "reference-architecture/port-resource-promotion/terraform/terraform/**"
      - ".github/workflows/port-promote-terraform.yml"
      - ".github/actions/terraform-*/**"
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      apply:
        description: "Apply plan to Integration after planning (plan-only by default)"
        type: boolean
        default: false

# Least privilege: jobs elevate their own GITHUB_TOKEN only where needed.
permissions:
  contents: read

env:
  TERRAFORM_VERSION: "1.15.8"
  # Terraform root module; override with a TF_WORKING_DIRECTORY repository variable.
  TF_WORKING_DIRECTORY: "${{ vars.TF_WORKING_DIRECTORY || 'reference-architecture/port-resource-promotion/terraform/terraform' }}"
  TF_PLAN_FILE: tfplan
  # Required for port_page / port_folder resources from the import generator.
  PORT_BETA_FEATURES_ENABLED: "true"
  # Workspaces become ${TFC_WORKSPACE_SLUG}-${environment}, e.g. port-config-integration.
  TFC_WORKSPACE_SLUG: port-config
  TFC_WORKSPACE_TAGS: port-config

# Promote → Integration

jobs:

  plan-int:
    name: "Plan config → Integration"
    if: |
      github.event_name != 'release' &&
      (github.event_name != 'pull_request' ||
        github.event.pull_request.head.repo.full_name == github.repository)
    environment: integration
    permissions:
      contents: read
      pull-requests: write      # posts the plan as a PR comment
    concurrency:
      group: port-plan-int-${{ github.event.pull_request.number || github.run_id }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    env:
      ENVIRONMENT: integration
      PORT_CLIENT_ID: ${{ vars.PORT_CLIENT_ID }}
      PORT_CLIENT_SECRET: ${{ secrets.PORT_CLIENT_SECRET }}
      PORT_BASE_URL: ${{ vars.PORT_BASE_URL || 'https://api.us.port.io' }}
      TF_API_TOKEN: ${{ secrets.TF_API_TOKEN }}
      TFC_ORGANIZATION: ${{ vars.TFC_ORGANIZATION }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - uses: ./.github/actions/terraform-setup
        id: setup
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          tfc_token: ${{ secrets.TF_API_TOKEN }}

      - uses: ./.github/actions/terraform-workspace
        with:
          workspace_name: ${{ steps.setup.outputs.tf_workspace }}
          organization: ${{ steps.setup.outputs.tfc_organization }}
          workspace_tags: ${{ env.TFC_WORKSPACE_TAGS }}
          tfc_token: ${{ secrets.TF_API_TOKEN }}

      - uses: ./.github/actions/terraform-init
        with:
          working_directory: ${{ env.TF_WORKING_DIRECTORY }}
          tf_workspace: ${{ steps.setup.outputs.tf_workspace }}
          tfc_organization: ${{ steps.setup.outputs.tfc_organization }}

      - uses: ./.github/actions/terraform-plan
        with:
          working_directory: ${{ env.TF_WORKING_DIRECTORY }}
          tf_workspace: ${{ steps.setup.outputs.tf_workspace }}
          tfc_organization: ${{ steps.setup.outputs.tfc_organization }}
          plan_file: ${{ env.TF_PLAN_FILE }}
          summary_heading: "## Terraform Plan → Integration"
          summary_subheading: "**Ref:** `${{ github.ref_name }}` — **Run:** [${{ github.run_id }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})"
          capture_summary_file: "true"

      - name: Upload Terraform plan
        uses: actions/upload-artifact@v7
        with:
          name: tfplan-int-${{ github.run_id }}
          path: ${{ env.TF_WORKING_DIRECTORY }}/${{ env.TF_PLAN_FILE }}
          retention-days: 3
          if-no-files-found: error

      - name: Post PR plan comment
        # Fork guard repeated from the job-level if:, kept explicit here.
        # PR metadata passes through env, never interpolated into the shell body.
        if: |
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          MARKER="<!-- port-promote-terraform: plan-int -->"
          { echo "${MARKER}"; cat /tmp/summary.md; } > /tmp/comment-body.md
          jq -n --rawfile body /tmp/comment-body.md '{body: $body}' > /tmp/comment.json

          COMMENT_ID=$(gh api \
            "repos/${REPO}/issues/${PR_NUMBER}/comments" \
            --jq ".[] | select(.body | startswith(\"${MARKER}\")) | .id" | head -1)

          if [ -n "${COMMENT_ID}" ]; then
            gh api "repos/${REPO}/issues/comments/${COMMENT_ID}" \
              --method PATCH --input /tmp/comment.json
          else
            gh api "repos/${REPO}/issues/${PR_NUMBER}/comments" \
              --method POST --input /tmp/comment.json
          fi

  apply-int:
    name: "Apply config → Integration"
    needs: [plan-int]
    if: |
      github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' && inputs.apply == true)
    environment: integration
    permissions:
      contents: read
      actions: read             # downloads the saved plan from plan-int
    concurrency:
      group: port-apply-int
      cancel-in-progress: false
    runs-on: ubuntu-latest
    env:
      ENVIRONMENT: integration
      PORT_CLIENT_ID: ${{ vars.PORT_CLIENT_ID }}
      PORT_CLIENT_SECRET: ${{ secrets.PORT_CLIENT_SECRET }}
      PORT_BASE_URL: ${{ vars.PORT_BASE_URL || 'https://api.us.port.io' }}
      TF_API_TOKEN: ${{ secrets.TF_API_TOKEN }}
      TFC_ORGANIZATION: ${{ vars.TFC_ORGANIZATION }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - uses: ./.github/actions/terraform-setup
        id: setup
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          tfc_token: ${{ secrets.TF_API_TOKEN }}

      - uses: ./.github/actions/terraform-workspace
        with:
          workspace_name: ${{ steps.setup.outputs.tf_workspace }}
          organization: ${{ steps.setup.outputs.tfc_organization }}
          workspace_tags: ${{ env.TFC_WORKSPACE_TAGS }}
          tfc_token: ${{ secrets.TF_API_TOKEN }}

      - uses: ./.github/actions/terraform-init
        with:
          working_directory: ${{ env.TF_WORKING_DIRECTORY }}
          tf_workspace: ${{ steps.setup.outputs.tf_workspace }}
          tfc_organization: ${{ steps.setup.outputs.tfc_organization }}

      - name: Download Terraform plan
        uses: actions/download-artifact@v7
        with:
          name: tfplan-int-${{ github.run_id }}
          path: ${{ env.TF_WORKING_DIRECTORY }}

      - uses: ./.github/actions/terraform-apply
        with:
          working_directory: ${{ env.TF_WORKING_DIRECTORY }}
          tf_workspace: ${{ steps.setup.outputs.tf_workspace }}
          tfc_organization: ${{ steps.setup.outputs.tfc_organization }}
          plan_file: ${{ env.TF_PLAN_FILE }}
          summary_heading: "## Terraform Apply → Integration"
          summary_subheading: "**Commit:** [`${{ github.sha }}`](${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }})"

# Promote → Staging → Production

  plan-stg:
    name: "Plan config → Staging"
    if: github.event_name == 'release'
    environment: staging
    runs-on: ubuntu-latest
    env:
      ENVIRONMENT: staging
      PORT_CLIENT_ID: ${{ vars.PORT_CLIENT_ID }}
      PORT_CLIENT_SECRET: ${{ secrets.PORT_CLIENT_SECRET }}
      PORT_BASE_URL: ${{ vars.PORT_BASE_URL || 'https://api.us.port.io' }}
      TF_API_TOKEN: ${{ secrets.TF_API_TOKEN }}
      TFC_ORGANIZATION: ${{ vars.TFC_ORGANIZATION }}
    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/terraform-setup
        id: setup
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          tfc_token: ${{ secrets.TF_API_TOKEN }}

      - uses: ./.github/actions/terraform-workspace
        with:
          workspace_name: ${{ steps.setup.outputs.tf_workspace }}
          organization: ${{ steps.setup.outputs.tfc_organization }}
          workspace_tags: ${{ env.TFC_WORKSPACE_TAGS }}
          tfc_token: ${{ secrets.TF_API_TOKEN }}

      - uses: ./.github/actions/terraform-init
        with:
          working_directory: ${{ env.TF_WORKING_DIRECTORY }}
          tf_workspace: ${{ steps.setup.outputs.tf_workspace }}
          tfc_organization: ${{ steps.setup.outputs.tfc_organization }}

      - uses: ./.github/actions/terraform-plan
        with:
          working_directory: ${{ env.TF_WORKING_DIRECTORY }}
          tf_workspace: ${{ steps.setup.outputs.tf_workspace }}
          tfc_organization: ${{ steps.setup.outputs.tfc_organization }}
          plan_file: ${{ env.TF_PLAN_FILE }}
          summary_heading: "## Terraform Plan → Staging"
          summary_subheading: "**Release:** [${{ github.event.release.tag_name }}](${{ github.event.release.html_url }})"

      - name: Upload Terraform plan
        uses: actions/upload-artifact@v7
        with:
          name: tfplan-stg-${{ github.run_id }}
          path: ${{ env.TF_WORKING_DIRECTORY }}/${{ env.TF_PLAN_FILE }}
          retention-days: 3
          if-no-files-found: error

  apply-stg:
    name: "Apply config → Staging"
    needs: [plan-stg]
    if: github.event_name == 'release'
    environment: staging
    permissions:
      contents: read
      actions: read             # downloads the saved plan from plan-stg
    concurrency:
      group: port-apply-stg
      cancel-in-progress: false
    runs-on: ubuntu-latest
    env:
      ENVIRONMENT: staging
      PORT_CLIENT_ID: ${{ vars.PORT_CLIENT_ID }}
      PORT_CLIENT_SECRET: ${{ secrets.PORT_CLIENT_SECRET }}
      PORT_BASE_URL: ${{ vars.PORT_BASE_URL || 'https://api.us.port.io' }}
      TF_API_TOKEN: ${{ secrets.TF_API_TOKEN }}
      TFC_ORGANIZATION: ${{ vars.TFC_ORGANIZATION }}
    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/terraform-setup
        id: setup
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          tfc_token: ${{ secrets.TF_API_TOKEN }}

      - uses: ./.github/actions/terraform-workspace
        with:
          workspace_name: ${{ steps.setup.outputs.tf_workspace }}
          organization: ${{ steps.setup.outputs.tfc_organization }}
          workspace_tags: ${{ env.TFC_WORKSPACE_TAGS }}
          tfc_token: ${{ secrets.TF_API_TOKEN }}

      - uses: ./.github/actions/terraform-init
        with:
          working_directory: ${{ env.TF_WORKING_DIRECTORY }}
          tf_workspace: ${{ steps.setup.outputs.tf_workspace }}
          tfc_organization: ${{ steps.setup.outputs.tfc_organization }}

      - name: Download Terraform plan
        uses: actions/download-artifact@v7
        with:
          name: tfplan-stg-${{ github.run_id }}
          path: ${{ env.TF_WORKING_DIRECTORY }}

      - uses: ./.github/actions/terraform-apply
        with:
          working_directory: ${{ env.TF_WORKING_DIRECTORY }}
          tf_workspace: ${{ steps.setup.outputs.tf_workspace }}
          tfc_organization: ${{ steps.setup.outputs.tfc_organization }}
          plan_file: ${{ env.TF_PLAN_FILE }}
          summary_heading: "## Terraform Apply → Staging"
          summary_subheading: "**Release:** [${{ github.event.release.tag_name }}](${{ github.event.release.html_url }})"

  test-stg:
    name: "Test Staging (convergence + extension point)"
    needs: [apply-stg]
    if: github.event_name == 'release'
    environment: staging
    runs-on: ubuntu-latest
    env:
      ENVIRONMENT: staging
      PORT_CLIENT_ID: ${{ vars.PORT_CLIENT_ID }}
      PORT_CLIENT_SECRET: ${{ secrets.PORT_CLIENT_SECRET }}
      PORT_BASE_URL: ${{ vars.PORT_BASE_URL || 'https://api.us.port.io' }}
      TF_API_TOKEN: ${{ secrets.TF_API_TOKEN }}
      TFC_ORGANIZATION: ${{ vars.TFC_ORGANIZATION }}
    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/terraform-setup
        id: setup
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          tfc_token: ${{ secrets.TF_API_TOKEN }}

      - uses: ./.github/actions/terraform-workspace
        with:
          workspace_name: ${{ steps.setup.outputs.tf_workspace }}
          organization: ${{ steps.setup.outputs.tfc_organization }}
          workspace_tags: ${{ env.TFC_WORKSPACE_TAGS }}
          tfc_token: ${{ secrets.TF_API_TOKEN }}

      - uses: ./.github/actions/terraform-init
        with:
          working_directory: ${{ env.TF_WORKING_DIRECTORY }}
          tf_workspace: ${{ steps.setup.outputs.tf_workspace }}
          tfc_organization: ${{ steps.setup.outputs.tfc_organization }}

      - name: Convergence check
        # Verifies apply fully converged — fails if terraform plan still has changes.
        uses: ./.github/actions/terraform-plan
        with:
          working_directory: ${{ env.TF_WORKING_DIRECTORY }}
          tf_workspace: ${{ steps.setup.outputs.tf_workspace }}
          tfc_organization: ${{ steps.setup.outputs.tfc_organization }}
          plan_file: ${{ env.TF_PLAN_FILE }}
          expect_no_changes: "true"
          summary_heading: "## Terraform Convergence → Staging"

      # EXTEND: add Staging validation here — Port API reachability,
      # blueprint/action assertions, integration health checks.
      - name: Additional tests
        run: |
          echo "Convergence check passed. Add functional tests here as needed."

  apply-prd:
    name: "Apply config → Production (approval required)"
    needs: [test-stg]
    if: github.event_name == 'release'
    environment: production
    concurrency:
      group: port-apply-prd
      cancel-in-progress: false
    runs-on: ubuntu-latest
    env:
      ENVIRONMENT: production
      PORT_CLIENT_ID: ${{ vars.PORT_CLIENT_ID }}
      PORT_CLIENT_SECRET: ${{ secrets.PORT_CLIENT_SECRET }}
      PORT_BASE_URL: ${{ vars.PORT_BASE_URL || 'https://api.us.port.io' }}
      TF_API_TOKEN: ${{ secrets.TF_API_TOKEN }}
      TFC_ORGANIZATION: ${{ vars.TFC_ORGANIZATION }}
    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/terraform-setup
        id: setup
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          tfc_token: ${{ secrets.TF_API_TOKEN }}

      - uses: ./.github/actions/terraform-workspace
        with:
          workspace_name: ${{ steps.setup.outputs.tf_workspace }}
          organization: ${{ steps.setup.outputs.tfc_organization }}
          workspace_tags: ${{ env.TFC_WORKSPACE_TAGS }}
          tfc_token: ${{ secrets.TF_API_TOKEN }}

      - uses: ./.github/actions/terraform-init
        with:
          working_directory: ${{ env.TF_WORKING_DIRECTORY }}
          tf_workspace: ${{ steps.setup.outputs.tf_workspace }}
          tfc_organization: ${{ steps.setup.outputs.tfc_organization }}

      - uses: ./.github/actions/terraform-plan
        with:
          working_directory: ${{ env.TF_WORKING_DIRECTORY }}
          tf_workspace: ${{ steps.setup.outputs.tf_workspace }}
          tfc_organization: ${{ steps.setup.outputs.tfc_organization }}
          plan_file: ${{ env.TF_PLAN_FILE }}
          summary_heading: "## Terraform Plan → Production"
          summary_subheading: "**Release:** [${{ github.event.release.tag_name }}](${{ github.event.release.html_url }})"

      - uses: ./.github/actions/terraform-apply
        with:
          working_directory: ${{ env.TF_WORKING_DIRECTORY }}
          tf_workspace: ${{ steps.setup.outputs.tf_workspace }}
          tfc_organization: ${{ steps.setup.outputs.tfc_organization }}
          plan_file: ${{ env.TF_PLAN_FILE }}
          summary_heading: "## Terraform Apply → Production"
          summary_subheading: "**Release:** [${{ github.event.release.tag_name }}](${{ github.event.release.html_url }})"
