name: Terraform setup
description: >
  Validate Port/TFC environment config, derive the workspace name, and install
  Terraform. Read-only and local: provisioning lives in terraform-workspace,
  init/validate in terraform-init.

inputs:
  terraform_version:
    description: Terraform CLI version for hashicorp/setup-terraform.
    required: true
  tfc_token:
    description: Terraform Cloud API token, written to the CLI credentials file.
    required: true

outputs:
  tf_workspace:
    description: Derived TFC workspace name (${TFC_WORKSPACE_SLUG}-${ENVIRONMENT}).
    value: ${{ steps.derive.outputs.tf_workspace }}
  tfc_organization:
    description: Terraform Cloud organization this environment targets.
    value: ${{ steps.derive.outputs.tfc_organization }}

runs:
  using: composite
  steps:
    # Reads job env rather than inputs: PORT_CLIENT_* must be in the job
    # environment for the Port provider itself, so only values an action
    # consumes are promoted to inputs.
    - name: Validate Port and TFC config
      shell: bash
      run: |
        set -euo pipefail
        missing=()
        [ -z "${ENVIRONMENT:-}" ] && missing+=(ENVIRONMENT)
        [ -z "${PORT_CLIENT_ID:-}" ] && missing+=(PORT_CLIENT_ID)
        [ -z "${PORT_CLIENT_SECRET:-}" ] && missing+=(PORT_CLIENT_SECRET)
        [ -z "${TF_API_TOKEN:-}" ] && missing+=(TF_API_TOKEN)
        [ -z "${TFC_ORGANIZATION:-}" ] && missing+=(TFC_ORGANIZATION)
        [ -z "${TFC_WORKSPACE_SLUG:-}" ] && missing+=(TFC_WORKSPACE_SLUG)
        [ -z "${TFC_WORKSPACE_TAGS:-}" ] && missing+=(TFC_WORKSPACE_TAGS)
        if [ ${#missing[@]} -ne 0 ]; then
          echo "::error::Missing config in ${ENVIRONMENT:-<unset>} environment: ${missing[*]}"
          echo "Set each under Settings → Environments → ${ENVIRONMENT:-<unset>}."
          echo "Also set ENVIRONMENT on the job env: block to match the job's environment: key."
          exit 1
        fi

    # Emits outputs only. Downstream actions take TF_WORKSPACE /
    # TF_CLOUD_ORGANIZATION as declared inputs instead of reading GITHUB_ENV.
    - name: Derive workspace name
      id: derive
      shell: bash
      run: |
        set -euo pipefail
        TF_WORKSPACE="${TFC_WORKSPACE_SLUG:?}-${ENVIRONMENT:?}"
        echo "tf_workspace=${TF_WORKSPACE}" >> "${GITHUB_OUTPUT}"
        echo "tfc_organization=${TFC_ORGANIZATION:?}" >> "${GITHUB_OUTPUT}"
        echo "Derived TF_WORKSPACE=${TF_WORKSPACE}"

    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v4
      with:
        terraform_version: ${{ inputs.terraform_version }}
        terraform_wrapper: false
        cli_config_credentials_token: ${{ inputs.tfc_token }}
